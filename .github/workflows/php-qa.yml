name: PHP QA

# Reusable PHP quality-assurance pipeline: resolves the PHP version matrix from
# composer.json, then runs coding standards, static analysis, tests (matrix),
# optional mutation testing, and a single aggregate status check.
# Call it from a repo with:
#
#   jobs:
#     qa:
#       uses: nlemoine/.github/.github/workflows/php-qa.yml@<sha>
#       with:
#         cs-tool: php-cs-fixer
#       secrets: inherit

on:
  workflow_call:
    inputs:
      php-versions:
        description: 'Optional JSON array override for the test matrix. Empty = resolve supported versions from composer.json.'
        type: string
        default: ''
      cs-tool:
        description: 'Coding-standards tool: phpcs | php-cs-fixer | ecs.'
        type: string
        default: 'php-cs-fixer'
      cs-php-version:
        description: 'PHP version for coding standards. Empty = resolved floor.'
        type: string
        default: ''
      static-tool:
        description: 'Static analysis: auto | phpstan | psalm | none. auto = pick by config-file presence.'
        type: string
        default: 'auto'
      static-php-version:
        description: 'PHP version for static analysis. Empty = resolved floor.'
        type: string
        default: ''
      composer-dependency-versions:
        description: 'Composer dependency resolution for non-test jobs: locked | lowest | highest.'
        type: string
        default: 'highest'
      composer-options:
        description: 'Extra options passed to composer install/update.'
        type: string
        default: '--prefer-dist'
      test-lowest:
        description: 'Add a test leg with the lowest dependency versions on the floor PHP version.'
        type: boolean
        default: true
      coverage:
        description: 'Collect coverage on the floor leg and upload to Codecov.'
        type: boolean
        default: true
      extra-test-legs:
        description: 'JSON array of extra test legs, run in their own job. Each entry: {"name": "...", "php": "8.4", "env": {"KEY": "value"}, "dependency-versions": "highest", "experimental": false}. An experimental leg does not fail the gate.'
        type: string
        default: '[]'
      run-infection:
        description: 'Run Infection mutation testing (advisory unless infection-gate is true).'
        type: boolean
        default: false
      infection-diff:
        description: 'Mutate only the lines a pull request changes, with GitHub annotations. The job is skipped on other events.'
        type: boolean
        default: false
      infection-gate:
        description: 'Make the Infection job part of the aggregate gate.'
        type: boolean
        default: false
      infection-setup-command:
        description: 'Shell command run before Infection, e.g. to warm up a test bootstrap that writes to STDERR on its first run.'
        type: string
        default: ''
      extra-infection-args:
        description: 'Extra arguments appended to the Infection command.'
        type: string
        default: ''
      composer-normalize:
        description: 'Check composer.json with composer normalize --dry-run (needs ergebnis/composer-normalize installed).'
        type: boolean
        default: false
      rector:
        description: 'Rector dry-run: auto | true | false. auto = run when rector.php exists.'
        type: string
        default: 'auto'
      type-coverage:
        description: 'Run Pest type-coverage on the coverage leg (Pest projects only).'
        type: boolean
        default: false
      type-coverage-min:
        description: 'Minimum acceptable type-coverage percentage.'
        type: string
        default: '100'
      extra-cs-args:
        description: 'Extra arguments appended to the coding-standards command.'
        type: string
        default: ''
      extra-stan-args:
        description: 'Extra arguments appended to the static-analysis command.'
        type: string
        default: ''
    secrets:
      CODECOV_TOKEN:
        required: false

permissions: {}

jobs:
  resolve-versions:
    name: Resolve PHP versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.pick.outputs.versions }}
      lowest: ${{ steps.pick.outputs.lowest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: composer.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Resolve supported versions from composer.json
        id: range
        if: inputs.php-versions == ''
        uses: typisttech/php-matrix-action@73b41f402280305866c655b5a2485d5c9d7a36bc # v4.0.0

      - name: Select matrix
        id: pick
        env:
          OVERRIDE: ${{ inputs.php-versions }}
          RANGE_VERSIONS: ${{ steps.range.outputs.versions }}
          RANGE_LOWEST: ${{ steps.range.outputs.lowest }}
        run: |
          # php-matrix-action emits pretty-printed (multi-line) JSON, which
          # breaks the single-line GITHUB_OUTPUT format: compact it with jq.
          if [ -n "$OVERRIDE" ]; then
            versions="$(printf '%s' "$OVERRIDE" | jq -c '.')"
            lowest="$(printf '%s' "$OVERRIDE" | jq -r '.[0]')"
          else
            versions="$(printf '%s' "$RANGE_VERSIONS" | jq -c '.')"
            lowest="$RANGE_LOWEST"
          fi
          {
            echo "versions=$versions"
            echo "lowest=$lowest"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved PHP versions: $versions (floor: $lowest)"

  coding-standards:
    name: Coding standards (${{ inputs.cs-tool }})
    needs: resolve-versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.cs-php-version != '' && inputs.cs-php-version || needs.resolve-versions.outputs.lowest }}
          extensions: json, mbstring
          coverage: none
          tools: composer:v2, cs2pr

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: ${{ inputs.composer-dependency-versions }}
          composer-options: ${{ inputs.composer-options }}

      - name: Run PHP_CodeSniffer
        if: inputs.cs-tool == 'phpcs'
        env:
          EXTRA_ARGS: ${{ inputs.extra-cs-args }}
        run: |
          # shellcheck disable=SC2086 # intentional word-splitting of optional args
          vendor/bin/phpcs -q --report=checkstyle $EXTRA_ARGS | cs2pr

      - name: Run php-cs-fixer
        if: inputs.cs-tool == 'php-cs-fixer'
        env:
          EXTRA_ARGS: ${{ inputs.extra-cs-args }}
        run: |
          # shellcheck disable=SC2086 # intentional word-splitting of optional args
          vendor/bin/php-cs-fixer fix --dry-run --diff --format=checkstyle $EXTRA_ARGS | cs2pr

      - name: Run ECS
        if: inputs.cs-tool == 'ecs'
        env:
          EXTRA_ARGS: ${{ inputs.extra-cs-args }}
        run: |
          # ECS 13.3 removed the checkstyle output format, so there is
          # nothing for cs2pr to read; rely on ECS's own exit code.
          # shellcheck disable=SC2086 # intentional word-splitting of optional args
          vendor/bin/ecs check --no-progress-bar $EXTRA_ARGS

      - name: Run composer normalize
        if: inputs.composer-normalize
        run: composer normalize --dry-run

  static-analysis:
    name: Static analysis
    needs: resolve-versions
    if: inputs.static-tool != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.static-php-version != '' && inputs.static-php-version || needs.resolve-versions.outputs.lowest }}
          extensions: json, mbstring
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: ${{ inputs.composer-dependency-versions }}
          composer-options: ${{ inputs.composer-options }}

      - name: Run PHPStan
        if: >-
          inputs.static-tool == 'phpstan' ||
          (inputs.static-tool == 'auto' &&
           hashFiles('phpstan.neon', 'phpstan.neon.dist', 'phpstan.dist.neon') != '')
        env:
          EXTRA_ARGS: ${{ inputs.extra-stan-args }}
        run: |
          # shellcheck disable=SC2086 # intentional word-splitting of optional args
          vendor/bin/phpstan analyse --no-progress --error-format=github $EXTRA_ARGS

      - name: Run Psalm
        if: >-
          inputs.static-tool == 'psalm' ||
          (inputs.static-tool == 'auto' &&
           hashFiles('psalm.xml', 'psalm.xml.dist') != '')
        env:
          EXTRA_ARGS: ${{ inputs.extra-stan-args }}
        run: |
          # shellcheck disable=SC2086 # intentional word-splitting of optional args
          vendor/bin/psalm --output-format=github --no-cache $EXTRA_ARGS

  rector:
    name: Rector
    needs: resolve-versions
    if: inputs.rector != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.static-php-version != '' && inputs.static-php-version || needs.resolve-versions.outputs.lowest }}
          extensions: json, mbstring
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: ${{ inputs.composer-dependency-versions }}
          composer-options: ${{ inputs.composer-options }}

      - name: Run Rector
        if: inputs.rector == 'true' || (inputs.rector == 'auto' && hashFiles('rector.php') != '')
        run: vendor/bin/rector process --dry-run --no-progress-bar

  tests:
    name: Tests — PHP ${{ matrix.php }} (${{ matrix.dependency-versions }})
    needs: resolve-versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJson(needs.resolve-versions.outputs.versions) }}
        dependency-versions: ['highest']
        include: ${{ fromJson(inputs.test-lowest && format('[{{"php":"{0}","dependency-versions":"lowest"}}]', needs.resolve-versions.outputs.lowest) || '[]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring
          coverage: ${{ inputs.coverage && matrix.dependency-versions == 'highest' && matrix.php == needs.resolve-versions.outputs.lowest && 'pcov' || 'none' }}
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: ${{ matrix.dependency-versions }}
          composer-options: ${{ inputs.composer-options }}

      - name: Run tests
        if: ${{ !(inputs.coverage && matrix.dependency-versions == 'highest' && matrix.php == needs.resolve-versions.outputs.lowest) }}
        run: composer test

      - name: Run tests with coverage
        if: ${{ inputs.coverage && matrix.dependency-versions == 'highest' && matrix.php == needs.resolve-versions.outputs.lowest }}
        run: |
          if [ -f vendor/bin/pest ]; then
            vendor/bin/pest --ci --coverage --coverage-clover=coverage.xml --min=0
          else
            vendor/bin/phpunit --coverage-clover=coverage.xml
          fi

      - name: Upload coverage to Codecov
        if: ${{ inputs.coverage && matrix.dependency-versions == 'highest' && matrix.php == needs.resolve-versions.outputs.lowest }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Type coverage
        if: ${{ inputs.type-coverage && matrix.dependency-versions == 'highest' && matrix.php == needs.resolve-versions.outputs.lowest }}
        env:
          MIN: ${{ inputs.type-coverage-min }}
        run: vendor/bin/pest --type-coverage --min="$MIN"

  # Caller-defined legs (e.g. a WordPress trunk run) live in their own job:
  # added to the main matrix through `include`, a leg whose php and
  # dependency-versions match an existing combination would be merged into it
  # instead of running on its own.
  extra-tests:
    name: Tests — ${{ matrix.name }}
    needs: resolve-versions
    if: inputs.extra-test-legs != '' && inputs.extra-test-legs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.extra-test-legs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php || needs.resolve-versions.outputs.lowest }}
          extensions: json, mbstring
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: ${{ matrix.dependency-versions || 'highest' }}
          composer-options: ${{ inputs.composer-options }}

      # Step-level, so an experimental failure leaves the job (and the gate)
      # green; the warning below keeps it visible.
      - name: Run tests
        id: run-tests
        continue-on-error: ${{ matrix.experimental == true }}
        env:
          LEG_ENV: ${{ toJSON(matrix.env) }}
        run: |
          mapfile -t vars < <(jq -r '(. // {}) | to_entries[] | "\(.key)=\(.value)"' <<< "$LEG_ENV")
          env "${vars[@]}" composer test

      - name: Report experimental failure
        if: steps.run-tests.outcome == 'failure'
        env:
          LEG: ${{ matrix.name }}
        run: echo "::warning::Experimental test leg '$LEG' failed"

  mutation-tests:
    name: Mutation tests (Infection)
    needs: resolve-versions
    if: inputs.run-infection && (!inputs.infection-diff || github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The diff mode compares against the base branch, which a shallow
          # clone does not have. '0' is a string: a bare 0 is falsy and would
          # fall through to the 1.
          fetch-depth: ${{ inputs.infection-diff && '0' || '1' }}

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.static-php-version != '' && inputs.static-php-version || needs.resolve-versions.outputs.lowest }}
          extensions: json, mbstring
          coverage: xdebug
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: ${{ inputs.composer-dependency-versions }}
          composer-options: ${{ inputs.composer-options }}

      # Infection aborts its initial test run on the first byte written to
      # STDERR, so a bootstrap that reports a first-run install there (Mantle
      # installing WordPress, for one) has to be warmed up beforehand.
      - name: Run setup command
        if: inputs.infection-setup-command != ''
        env:
          SETUP_COMMAND: ${{ inputs.infection-setup-command }}
        run: bash -c "$SETUP_COMMAND"

      - name: Run Infection
        env:
          DIFF: ${{ inputs.infection-diff }}
          BASE_REF: ${{ github.base_ref }}
          EXTRA_ARGS: ${{ inputs.extra-infection-args }}
        run: |
          args=(--threads=max --no-progress)
          if [ "$DIFF" = "true" ]; then
            args+=("--git-diff-base=origin/$BASE_REF" --git-diff-lines --logger-github)
          fi
          # shellcheck disable=SC2086 # intentional word-splitting of optional args
          vendor/bin/infection "${args[@]}" $EXTRA_ARGS

  # mutation-tests is always listed so infection-gate can count it; when the
  # gate is off its result is ignored, but QA OK still waits for it.
  all-green:
    name: QA OK
    if: ${{ always() }}
    needs: [resolve-versions, coding-standards, static-analysis, rector, tests, extra-tests, mutation-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        env:
          RESULTS: >-
            ${{ needs.resolve-versions.result }}
            ${{ needs.coding-standards.result }}
            ${{ needs.static-analysis.result }}
            ${{ needs.rector.result }}
            ${{ needs.tests.result }}
            ${{ needs.extra-tests.result }}
            ${{ inputs.infection-gate && needs.mutation-tests.result || 'skipped' }}
        run: |
          echo "Required job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::A required job reported '$result'"
              exit 1
            fi
          done
